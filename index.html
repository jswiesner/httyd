<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>How to Train Your Dragon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="game" width="240" height="160"></canvas>
    <div id="touch-controls">
        <div id="dpad">
            <button class="dpad-btn" id="btn-up" data-key="ArrowUp">&#9650;</button>
            <button class="dpad-btn" id="btn-left" data-key="ArrowLeft">&#9664;</button>
            <button class="dpad-btn" id="btn-right" data-key="ArrowRight">&#9654;</button>
            <button class="dpad-btn" id="btn-down" data-key="ArrowDown">&#9660;</button>
        </div>
        <div id="action-buttons">
            <button class="action-btn" id="btn-b" data-key="x">B</button>
            <button class="action-btn" id="btn-a" data-key="z">A</button>
        </div>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/tilesets.js"></script>
    <script src="js/dragon-data.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/entity.js"></script>
    <script src="js/player.js"></script>
    <script src="js/companion.js"></script>
    <script src="js/npc.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/battle-engine.js"></script>
    <script src="js/battle-renderer.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/hud.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
